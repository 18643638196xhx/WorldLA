[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worldla"
version = "0.2.0"
description = "Stage-conditioned relation transfer and plan fusion for efficient robot control"
requires-python = ">=3.11,<3.12"
readme = "README.md"
license = {file = "LICENSE"}
dependencies = ["numpy==1.26.4", "PyYAML>=6.0", "Pillow>=11.0.0"]

[project.optional-dependencies]
runtime = [
  "jax==0.5.0", "flax==0.10.2", "orbax-checkpoint==0.11.1",
  "einops>=0.8", "jaxtyping==0.2.36", "beartype>=0.19", "ml-dtypes>=0.4",
  "sentencepiece>=0.2", "transformers==4.48.1", "torch>=2.5.1",
  "etils[epath]>=1.10", "numpydantic>=1.6.6", "pydantic>=2",
  "typing-extensions>=4.12", "safetensors>=0.4", "optax>=0.2",
  "treescope>=0.1.7", "fsspec>=2024.6", "gcsfs>=2024.6", "augmax>=0.3.4",
  "opencv-python>=4.10", "huggingface-hub==0.28.1", "tqdm-loggable>=0.2", "filelock>=3.16"
]
train = [
  "worldla[runtime]", "tyro>=0.9.5", "ml-collections==1.0.0", "wandb>=0.19",
  "dm-tree>=0.1.8", "equinox>=0.11.8", "datasets>=3", "pyarrow>=17", "pandas>=2",
  "lerobot @ git+https://github.com/huggingface/lerobot.git@a445d9c9da6bea99a8972daa4fe1fdd053d711d2"
]
dev = ["pytest>=8", "build>=1", "ruff>=0.8"]

[project.scripts]
worldla = "worldla.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt", "licenses/provenance/*.json"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["worldla*"]
namespaces = true

[tool.setuptools.package-data]
worldla = ["_provenance.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["src/worldla/models/compat", "src/worldla/torch_backend/transformers_replace"]
